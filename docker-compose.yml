version: '3.8'

services:
  backend:
    build: .
    container_name: roommate-roulette-backend
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=Roommate Chore & Expense Roulette
      - DATABASE_URL=sqlite+aiosqlite:///./roommate_roulette.db
      - SECRET_KEY=09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
    volumes:
      - .:/app
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sih-buddy-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_BACKEND_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
